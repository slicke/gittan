# Gittan's own commands, shown on the Commands page (spec/repo-commands.md).
# The Makefile's targets are listed by themselves; a table named as one
# gives it a key: Ctrl+Cmd on macOS, Ctrl+Alt elsewhere.

[commands.build]
key = "B"

[commands.test]
key = "T"

[commands.run]
key = "R"

[commands.debug]
key = "U"

[commands.rebuild]
key = "E"

[commands.clean]
key = "C"
description = "Remove the built units and the executable"
confirm = true

[commands.lexlib]
key = "L"

[commands.log]
run = "git -c color.ui=always log --oneline --graph --decorate -20"
key = "G"
description = "The last 20 commits as a graph"
