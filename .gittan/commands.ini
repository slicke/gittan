; Gittan's own commands, shown on the Commands page (spec/repo-commands.md).
; The Makefile's targets are listed by themselves; a section named as
; one gives it a key: Ctrl+Cmd on macOS, Ctrl+Alt elsewhere.

[build]
key = B

[test]
key = T

[run]
key = R

[debug]
key = D

[rebuild]
key = E

[clean]
key = C

[lexlib]
key = L

[log]
command = git -c color.ui=always log --oneline --graph --decorate -20
key = G
