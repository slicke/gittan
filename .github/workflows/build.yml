name: Build (All Platforms)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# ---------------------------------------------------------------------------------
# WORKFLOW OVERVIEW
# ---------------------------------------------------------------------------------
# One matrix job builds Gittan natively on each platform and uploads a package:
#   - macOS (arm64):   Gittan-macos-silicon.dmg  (Gittan.app with lexlib inside)
#   - Windows (x64):   Gittan-windows-x64.zip    (Gittan.exe + lexlib/)
#   - Linux (amd64):   Gittan-linux-amd64.tar.gz (Gittan + lexlib/, GTK 3)
#
# As in Trndi, a push to main publishes a release: the version job takes the
# next build number from the "build-<n>" tags (100 when there is none), and
# the publish job creates the release "build-<n>" with the three packages and
# the commits since the previous build as its notes. PRs only upload artifacts.
# Every leg also builds and runs the unit tests in tests/ (`make test`).
#
# The toolchain is Lazarus 5.0RC1 (Trndi pins 4.8). One thing differs from
# Trndi:
#   - vendor/ holds the ATSynEdit packages as git submodules. A fresh Lazarus
#     knows none of them, so every leg registers their .lpk files with
#     `lazbuild --add-package-link` before building (lazbuild then compiles them
#     on demand as dependencies of Gittan.lpi).
# ---------------------------------------------------------------------------------

concurrency:
  group: gittan-build-${{ github.ref }}
  # Cancel superseded PR builds; never cancel main builds
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Registration order follows the dependencies: atsynedit_package needs the
  # first three, atsynedit_ex_package needs econtrol_package.
  VENDOR_PACKAGES: >-
    vendor/ATFlatControls/atflatcontrols/atflatcontrols_package.lpk
    vendor/EncConv/encconv/encconv_package.lpk
    vendor/BGRABitmap/bgrabitmap/bgrabitmappack.lpk
    vendor/ATSynEdit/atsynedit/atsynedit_package.lpk
    vendor/EControl/econtrol/econtrol_package.lpk
    vendor/ATSynEdit_Ex/atsynedit_ex/atsynedit_ex_package.lpk
    vendor/metadarkstyle/metadarkstyle.lpk
    vendor/lazink/lazink.lpk

jobs:
  # ===================== DETERMINE VERSION =====================
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only a push to main publishes; PRs and manual runs skip this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      build_number: ${{ steps.setver.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and every tag, for the build-<n> tags below.
          fetch-depth: 0

      - name: Determine the next build number
        id: setver
        run: |
          set -euo pipefail
          LATEST=$(git tag | grep -E '^build-[0-9]+$' | sed 's/^build-//' | sort -n | tail -1 || true)
          if [ -z "$LATEST" ]; then NEXT=100; else NEXT=$((LATEST + 1)); fi
          echo "build_number=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next build number: ${NEXT}"

  # ===================== BUILD MATRIX =====================
  build:
    name: Build (${{ matrix.name }})
    needs: version
    # Run for PRs too, where the version job is skipped.
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    # Far above a normal build, far below the 6h default a hung lazbuild would burn.
    timeout-minutes: 90
    env:
      # Compiled into gittan.update, which compares it with the latest
      # release; empty on a PR, where the version job is skipped.
      GITTAN_BUILD: ${{ needs.version.outputs.build_number }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os_target: linux
            runner: ubuntu-latest
          - name: macos-arm64
            os_target: macos
            runner: macos-14
          - name: windows-x64
            os_target: windows
            runner: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # ===================== TOOLCHAINS =====================
      - name: Install Lazarus/FPC (Linux)
        if: matrix.os_target == 'linux'
        env:
          FPC_LAZ_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%205.0RC1/fpc-laz_3.2.2-210709_amd64.deb/download
          FPC_SRC_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%205.0RC1/fpc-src_3.2.2-210709_amd64.deb/download
          LAZ_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%205.0RC1/lazarus-project_5.0.0-0_amd64.deb/download
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl \
            libgtk-3-dev
          # SourceForge mirrors flake; retry hard before failing the job.
          # --connect-timeout and the speed guard abort a stalled or
          # half-open transfer (which is not an error, so --retry-all-errors
          # alone would wait on it forever) so the retry can take over.
          CURL_RETRY="--retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 30 --speed-limit 1024 --speed-time 60"
          curl -fsSL $CURL_RETRY -o fpc-laz.deb "$FPC_LAZ_URL"
          curl -fsSL $CURL_RETRY -o fpc-src.deb "$FPC_SRC_URL"
          curl -fsSL $CURL_RETRY -o lazarus.deb "$LAZ_URL"
          sudo dpkg -i fpc-laz.deb fpc-src.deb lazarus.deb || true
          sudo apt-get -f install -y
          rm -f fpc-laz.deb fpc-src.deb lazarus.deb
          fpc -iV
          lazbuild --version

      - name: Install Lazarus/FPC (macOS)
        if: matrix.os_target == 'macos'
        # A stalled mirror must not burn the whole 90-minute job budget.
        timeout-minutes: 30
        env:
          FPC_DMG_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%205.0RC1/fpc-3.2.4rc2.intelarm64-macosx.dmg/download
          LAZ_ZIP_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%205.0RC1/lazarus-darwin-aarch64-5.0RC1.zip/download
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          # The speed guard aborts a stalled or half-open transfer (not an
          # error, so --retry-all-errors would otherwise wait on it forever)
          # so the retry can take over instead of hanging the job.
          CURL_RETRY="--retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 30 --speed-limit 1024 --speed-time 60"
          DL="$RUNNER_TEMP/toolchain"
          mkdir -p "$DL"
          curl -fsSL $CURL_RETRY -o "$DL/fpc.dmg" "$FPC_DMG_URL"
          curl -fsSL $CURL_RETRY -o "$DL/lazarus.zip" "$LAZ_ZIP_URL"

          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DL/fpc.dmg"
          PKG="$(find "$MNT" -maxdepth 2 -name '*.pkg' | head -n1)"
          [ -n "$PKG" ] || { echo "No .pkg found in the FPC dmg" >&2; exit 1; }
          sudo installer -pkg "$PKG" -target /
          hdiutil detach "$MNT"

          brew install make

          xattr -cr "$DL/lazarus.zip"
          EXTRACT="$(mktemp -d)"
          unzip -q "$DL/lazarus.zip" -d "$EXTRACT"
          LB="$(find "$EXTRACT" -maxdepth 3 -name lazbuild -type f | head -n1)"
          [ -n "$LB" ] || { echo "lazbuild not found in the Lazarus zip" >&2; exit 1; }
          sudo rm -rf /Applications/lazarus
          sudo mv "$(dirname "$LB")" /Applications/lazarus
          sudo xattr -cr /Applications/lazarus

          # Point the zip's Lazarus at the installed FPC through a primary
          # config path of its own (the zip ships without any configuration).
          GMAKE="$(brew --prefix)/bin/gmake"
          sudo mkdir -p /Applications/lazarus/config
          printf -- '--pcp=/Applications/lazarus/config\n--lazarusdir=/Applications/lazarus\n' \
            | sudo tee /Applications/lazarus/lazarus.cfg >/dev/null
          sudo tee /Applications/lazarus/config/environmentoptions.xml >/dev/null <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <CONFIG>
            <EnvironmentOptions>
              <Version Value="112" Lazarus="5.0RC1"/>
              <LazarusDirectory Value="/Applications/lazarus/"/>
              <CompilerFilename Value="/usr/local/bin/fpc"/>
              <FPCSourceDirectory Value="\$(LazarusDir)/fpc/\$(FPCVer)/sources/"/>
              <MakeFilename Value="$GMAKE"/>
              <TestBuildDirectory Value="\$ENV(TMPDIR)"/>
            </EnvironmentOptions>
          </CONFIG>
          XML
          sudo sed -i '' -e 's/^          //' /Applications/lazarus/config/environmentoptions.xml
          sudo chown -R "$(id -u):$(id -g)" /Applications/lazarus/config

          echo "/Applications/lazarus" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          export PATH="/Applications/lazarus:/usr/local/bin:$(brew --prefix)/bin:$PATH"
          fpc -iV
          lazbuild --version

      - name: Install Lazarus/FPC (Windows)
        if: matrix.os_target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --speed-limit 1024 --speed-time 60 -o lazarus-5.0RC1.exe "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%205.0RC1/lazarus-5.0RC1-fpc-3.2.2-win64.exe/download"
          # SourceForge sometimes answers with an HTML page; check for the MZ header.
          $fs = [System.IO.File]::OpenRead('lazarus-5.0RC1.exe')
          $mz = New-Object byte[] 2
          $null = $fs.Read($mz, 0, 2)
          $fs.Close()
          if (($mz[0] -ne 0x4D) -or ($mz[1] -ne 0x5A)) {
            throw "lazarus-5.0RC1.exe is not a Windows executable; the mirror likely returned a web page."
          }
          Start-Process '.\lazarus-5.0RC1.exe' -ArgumentList '/VERYSILENT','/SP-','/NORESTART','/DIR=C:\Lazarus' -Wait
          Remove-Item 'lazarus-5.0RC1.exe'
          Add-Content $env:GITHUB_PATH 'C:\Lazarus'
          & 'C:\Lazarus\lazbuild.exe' --version

      # ===================== VENDORED PACKAGES =====================
      - name: Register vendored packages
        shell: bash
        run: |
          set -euo pipefail
          LAZARGS=()
          if [ "${{ matrix.os_target }}" = "windows" ]; then LAZARGS+=(--lazarusdir='C:\Lazarus'); fi
          for LPK in $VENDOR_PACKAGES; do
            [ -f "$LPK" ] || { echo "::error::$LPK is missing; are the submodules checked out?"; exit 1; }
            # ${a[@]+...}: macOS's bash 3.2 calls an empty array unbound under set -u.
            lazbuild ${LAZARGS[@]+"${LAZARGS[@]}"} --add-package-link "$LPK"
          done

      # ===================== BUILD + PACKAGE =====================
      - name: Build and package (Linux)
        if: matrix.os_target == 'linux'
        run: |
          set -euo pipefail
          # The Makefile builds with gtk3 on Linux and refreshes lexlib/.
          make
          make test
          mkdir -p dist/Gittan
          cp Gittan dist/Gittan/
          cp -r lexlib dist/Gittan/
          cp icons/png/gittan-256.png dist/Gittan/gittan.png
          tar -C dist -czf Gittan-linux-amd64.tar.gz Gittan

      - name: Build and package (macOS)
        if: matrix.os_target == 'macos'
        run: |
          set -euo pipefail
          # The Makefile builds with cocoa, refreshes lexlib/ and puts the icon
          # into Gittan.app.
          gmake
          gmake test
          # Lazarus's bundle links Contents/MacOS/Gittan to ../../../Gittan;
          # replace the link with the binary and carry lexlib in Resources,
          # where gittan.lexers.pp looks for it.
          mkdir -p dist
          cp -R Gittan.app dist/
          rm -f dist/Gittan.app/Contents/MacOS/Gittan
          cp Gittan dist/Gittan.app/Contents/MacOS/Gittan
          # FPC's -Xs leaves the symbols in on macOS; strip them (27 MB to
          # 12 MB with the smart linking of the Release mode).
          strip dist/Gittan.app/Contents/MacOS/Gittan
          cp -R lexlib dist/Gittan.app/Contents/Resources/
          # Apple Silicon refuses unsigned code; sign ad hoc.
          codesign --force --deep --sign - dist/Gittan.app
          codesign --verify --deep --strict dist/Gittan.app
          ln -s /Applications dist/Applications
          hdiutil create -volname Gittan -srcfolder dist -ov -format UDZO Gittan-macos-silicon.dmg

      - name: Build and package (Windows)
        if: matrix.os_target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # No make on the Windows runner; this is what `make lexlib` does.
          rm -rf lexlib && mkdir -p lexlib
          find vendor/CudaText-lexers lexers -mindepth 2 -maxdepth 2 \( -name '*.lcf' -o -name '*.cuda-lexmap' \) -exec cp -p {} lexlib/ \;
          echo "Copied $(ls lexlib/*.lcf | wc -l) lexers to lexlib/"
          lazbuild --lazarusdir='C:\Lazarus' --widgetset=win32 --bm=Release Gittan.lpi
          # The unit tests, as `make test` builds them: a console program
          # compiled with the fpc that comes with the Lazarus installer.
          FPC="$(find /c/Lazarus/fpc -name fpc.exe -path '*x86_64-win64*' | head -n1)"
          [ -n "$FPC" ] || { echo "::error::fpc.exe not found under C:\Lazarus\fpc"; exit 1; }
          mkdir -p tests/lib
          "$FPC" -Mobjfpc -Sh -O1 -Fusrc/core -FUtests/lib -FEtests tests/gittantests.lpr
          tests/gittantests.exe --all --format=plain
          mkdir -p dist/Gittan
          cp Gittan.exe dist/Gittan/
          cp -r lexlib dist/Gittan/
          (cd dist && 7z a -tzip ../Gittan-windows-x64.zip Gittan >/dev/null)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gittan-${{ matrix.name }}
          path: |
            Gittan-linux-amd64.tar.gz
            Gittan-macos-silicon.dmg
            Gittan-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # ===================== PUBLISH =====================
  publish:
    name: Publish build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, build]
    permissions:
      contents: write
    # Plain needs semantics: a failed leg skips the release, so no release
    # ever lacks a platform.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.version.outputs.build_number }}
        run: |
          set -euo pipefail
          TAG="build-${BUILD}"
          PREV="build-$((BUILD - 1))"
          ls -l packages

          # The commits since the previous build, or the last ten for the first one.
          if git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            CHANGES=$(git log --no-merges --format='- %s' "${PREV}..HEAD")
            [ -n "$CHANGES" ] || CHANGES="- No new commits"
          else
            CHANGES=$(git log --no-merges --format='- %s' -10)
          fi

          {
            echo "Automated build of Gittan from the latest source."
            echo
            echo "## Changes"
            echo
            echo "$CHANGES"
            echo
            echo "## Downloads"
            echo
            echo '- **Gittan-macos-silicon.dmg** — macOS on Apple Silicon. The app is signed ad hoc, so macOS blocks it at first: drag it to Applications, then run `xattr -cr /Applications/Gittan.app` in Terminal.'
            echo "- **Gittan-windows-x64.zip** — Windows x64. Unzip anywhere and run Gittan.exe."
            echo "- **Gittan-linux-amd64.tar.gz** — Linux amd64, needs GTK 3."
            echo
            echo "Gittan runs the git command line tool, so git must be on your PATH."
          } > notes.md

          # The release is made as a draft, filled, then published, so
          # releases/latest never lacks the packages. A re-run of this job
          # after a failed upload finds the draft and uploads the packages
          # again instead of failing on it; a published release is left as
          # it is, since --clobber deletes an asset before uploading its
          # replacement.
          if ! DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft 2>/dev/null); then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Gittan build ${BUILD}" \
              --notes-file notes.md \
              --draft
          elif [ "$DRAFT" != "true" ]; then
            echo "$TAG is published already; nothing to do."
            exit 0
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            packages/Gittan-macos-silicon.dmg \
            packages/Gittan-windows-x64.zip \
            packages/Gittan-linux-amd64.tar.gz
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
