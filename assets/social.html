<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;600&family=Varela+Round&display=swap">
<link rel="stylesheet" href="site.css">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #141a26; color: #e9edf5; position: relative; isolation: isolate; }
body::before { content: ""; position: absolute; z-index: -1; right: -120px; top: -160px; width: 820px; height: 820px; background: radial-gradient(closest-side, rgba(43,224,112,.28), rgba(43,224,112,.08) 55%, transparent); }
.card { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img:first-child { width: 56px; height: 56px; border-radius: 14px; }
.brand img:last-child { height: 40px; width: auto; }
.diffhead { margin-top: 64px; gap: 14px; width: 760px; }
.diffhead .del { font-size: 38px; padding: .22em .7em .22em 1.5em; }
.diffhead .add { font-size: 104px; line-height: .98; padding: .14em .3em .16em .62em; }
.diffhead .add span { display: block; }
.tag-line { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; font: 400 28px/1.3 "Afacad", sans-serif; color: #9aa6bc; }
.tag-line b { font-weight: 600; color: #e9edf5; }
</style></head><body>
<div class="card">
  <div class="brand"><img src="icon-256.png" alt=""><img src="name-dark.svg" alt="gittan"></div>
  <div class="diffhead"><p class="del">Wonder what changed.</p><h1 class="add"><span>Understand</span><span>every change.</span></h1></div>
  <p class="tag-line"><span>A free, native git client built around the diff.<br>macOS, Windows and Linux, and more.</span><b>gittan.app</b></p>
</div></body></html>
